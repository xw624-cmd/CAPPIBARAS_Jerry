# Minimal CAPPIBARAS template for ONE of the six independent fits.
# submit_Wang2026.py clones this template into bin0/1/2 x major/minor YAMLs.
#
# Install Models/Papers/Wang2026.py into this CAPPIBARAS checkout.
# The bundled Popik2026.Pressure1h already has PL() evolution enabled.

likelihood:
  Wang2026:
    class: SOLikelihoods.SOLikelihood

    Measurement:
      name: Wang2026
      profile_file: &paired_cap_npz /Users/jerrywang/Documents/Battaglia_research/Project1/Stacking_code_3bins/run_output/paired_sector_cap_bootstraps.npz
      mass_bin: 0
      sector: major

    TargetData:
      name: Wang2026
      profile_file: *paired_cap_npz
      mass_bin: 0
      
      zNum: 10
      logMhNum: 20

shared:
  Cosmology:
    name: pyccl
    h: 0.70
    Omega_m: 0.25
    Omega_b: 0.044
    sigma8: 0.80
    n_s: 0.96
    T_CMB: 2.725
    XH: 0.76

  HaloModel:
    name: pyccl
    MassDef: 200c
    MassFunc: Tinker08
    HaloBias: Tinker10
    Concentration: Bhattacharya13

  MapData:
    name: Wang2026
    beam_file: /Users/jerrywang/Documents/Battaglia_research/Project1/Data/ACTDR6/ilc_beam.txt

  Projection:
    name: Popik2026

  BeamConvolution:
    name: Popik2026

  # Only the observable/filter differs from Popik2026 here.
  CAP:
    name: Wang2026
    inner_radius_arcmin: 1.0

  Pressure:
    name: Popik2026
    twohalofix: fixed

params:
  P0:
    latex: "P_0"
    prior: {min: 0.0, max: 60.0}
    proposal: 0.25

  beta_P:
    latex: "\\beta_P"
    prior: {min: 0.0, max: 10.0}
    proposal: 0.15

  A_2h_P:
    latex: "A_{2h,P}"
    prior: {min: 0.0, max: 60.0}
    proposal: 0.25

sampler:
  mcmc:
    Rminus1_stop: 0.001
